name: Release

on:
  push:
    tags:
      - "*.*.*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Read manifest
        id: manifest
        run: |
          node -e "
            const fs = require('fs');
            const m = JSON.parse(fs.readFileSync('manifest.json', 'utf8'));
            fs.appendFileSync(process.env.GITHUB_OUTPUT, 'version=' + m.version + '\n');
            fs.appendFileSync(process.env.GITHUB_OUTPUT, 'min_app=' + m.minAppVersion + '\n');
          "

      - name: Check tag matches manifest version
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${{ steps.manifest.outputs.version }}"
          if [ "$TAG" != "$VERSION" ]; then
            echo "Tag ($TAG) does not match manifest version ($VERSION)"
            exit 1
          fi

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            main.js
            manifest.json
            versions.json

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.manifest.outputs.version }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            main.js
            manifest.json
            versions.json
